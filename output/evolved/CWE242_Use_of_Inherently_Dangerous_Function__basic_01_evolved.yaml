rules:
  - id: CWE242_Use_of_Inherently_Dangerous_Function__basic_01
    message: "Use of gets() is inherently dangerous and can lead to buffer overflows. Use fgets() instead."
    severity: ERROR
    metadata:
      cwe: "CWE242"
    languages: [c, cpp]
    patterns:
      # Match any use of gets(...) (assigned or not)
      - pattern-either:
          - pattern: gets(...)
          - pattern: $X = gets(...)
      # Exclude the safe bounded alternative using fgets with stdin
      - pattern-not: $X = fgets(..., ..., stdin)