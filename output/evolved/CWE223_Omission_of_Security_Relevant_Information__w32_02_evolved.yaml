rules:
  - id: CWE223_Omission_of_Security_Relevant_Information__w32_02
    message: "Potential omission of security-relevant information by not logging the username."
    severity: ERROR
    metadata:
      cwe: "CWE223"
    languages: [c, cpp]
    patterns:
      # Core bad sink: login attempt logged without including the username
      - pattern-either:
          - pattern: |
              fprintf(stderr, "Attempted login\n");
          - pattern: |
              fprintf(stderr, "Attempted login");
      # Exclude the good pattern where the username is actually logged
      - pattern-not: |
          fprintf(stderr, "Attempted login by %s\n", username);
      - pattern-not: |
          fprintf(stderr, "Attempted login by %s", username);