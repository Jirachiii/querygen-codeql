rules:
  - id: CWE197_Numeric_Truncation_Error__int_connect_socket_to_char_02
    message: "Potential numeric truncation error when converting int to char."
    severity: ERROR
    metadata:
      cwe: "CWE197"
    languages: [c, cpp]
    patterns:
      # Core sink: int → char narrowing cast/initialization
      - pattern: |
          char $CHAR_DATA = (char)$DATA;
      # Exclude the explicit safe patterns used in the good variants
      - pattern-not: |
          int $DATA = CHAR_MAX - $OFFSET;
      - pattern-not: |
          $DATA = CHAR_MAX - $OFFSET;