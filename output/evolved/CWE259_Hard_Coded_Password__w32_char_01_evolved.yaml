rules:
  - id: CWE259_Hard_Coded_Password__w32_char_01
    message: "Detects use of hardcoded password (CWE-259)"
    severity: ERROR
    metadata:
      cwe: "CWE259"
    languages: [c, cpp]
    patterns:
      # Core vulnerable pattern: copying a hardcoded password-like macro/constant into a password buffer
      - pattern: |
          strcpy($PASSWORD_VAR, $HARDCODED_VALUE);
      # Exclude the safe case where the password buffer is filled from stdin via fgets
      - pattern-not: |
          fgets($PASSWORD_VAR, $N, stdin);
      # Exclude the safe case where the password buffer is filled from stdin via gets (legacy)
      - pattern-not: |
          gets($PASSWORD_VAR);