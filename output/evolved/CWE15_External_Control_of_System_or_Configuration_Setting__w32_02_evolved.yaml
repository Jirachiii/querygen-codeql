rules:
  - id: CWE15_External_Control_of_System_or_Configuration_Setting__w32_02
    message: "Potential external control of system or configuration setting vulnerability (SetComputerNameA from network data)."
    severity: ERROR
    metadata:
      cwe: "CWE-15"
    languages: [c, cpp]
    patterns:
      # Core bad pattern: data read from recv(...) and later used as SetComputerNameA argument
      - pattern: |
          char * $DATA;
          ...
          recv($SOCKET, $DATA, ..., 0);
          ...
          if (!SetComputerNameA($DATA))
          {
            ...
          }

      # New variant: pointer assigned to a stack buffer, buffer passed to recv, and
      # that same pointer (data) used in SetComputerNameA. This matches the provided bad() example.
      - pattern: |
          char * $DATA;
          ...
          char $BUF[...];
          ...
          $DATA = $BUF;
          ...
          recv($SOCKET, $DATA, ..., 0);
          ...
          if (!SetComputerNameA($DATA))
          {
            ...
          }

      # Exclude the known safe pattern where the hostname is taken from a string literal
      - pattern-not: |
          char * $DATA;
          ...
          strcpy($DATA, "hostname");
          ...
          if (!SetComputerNameA($DATA))
          {
            ...
          }