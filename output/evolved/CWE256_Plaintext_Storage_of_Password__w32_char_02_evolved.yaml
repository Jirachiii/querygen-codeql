rules:
  - id: CWE256_Plaintext_Storage_of_Password__w32_char_02
    message: "Potential CWE-256: Plaintext Storage of Password detected (LogonUserA with non-decrypted data)."
    severity: ERROR
    metadata:
      cwe: "CWE-256"
    languages: [c, cpp]
    patterns:
      # Core vulnerable sink: LogonUserA called with some password argument
      - pattern: |
          if (LogonUserA(
                  $USERNAME,
                  $DOMAIN,
                  $DATA,
                  LOGON32_LOGON_NETWORK,
                  LOGON32_PROVIDER_DEFAULT,
                  &$PHANDLE) != 0) {
            ...
          }
      # Exclude cases where the password data has been decrypted in the
      # canonical CERT/CWE test-case style just before being passed.
      # First common pattern: CryptDecrypt in a do { ... } while(0); block
      - pattern-not: |
          do {
              ...
              if (!CryptDecrypt(
                        $HKEY,
                        0,
                        1,
                        0,
                        $PAYLOAD,
                        &$PAYLOADBYTES)) {
                  break;
              }
              /* Copy back into data and NUL-terminate */
              memcpy($DATA, $PAYLOAD, $PAYLOADBYTES);
              $DATA[$PAYLOADBYTES / sizeof(char)] = '\0';
              ...
          } while(0);
      # Second common pattern: CryptDecrypt in a do { ... } while(0); block
      # where the decrypted buffer is the same as the buffer later passed
      # to LogonUserA (as seen in goodB2G1/goodG2B1/goodG2B2).
      - pattern-not: |
          do {
              ...
              if (!CryptDecrypt(
                        $HKEY,
                        0,
                        1,
                        0,
                        $DATA,
                        &$PAYLOADBYTES)) {
                  break;
              }
              /* Copy back into data and NUL-terminate */
              memcpy($DATA, $PAYLOAD, $PAYLOADBYTES);
              $DATA[$PAYLOADBYTES / sizeof(char)] = '\0';
              ...
          } while(0);