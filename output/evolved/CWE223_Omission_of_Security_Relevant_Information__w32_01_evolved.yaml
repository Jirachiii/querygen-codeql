rules:
  - id: CWE223_Omission_of_Security_Relevant_Information__w32_01
    message: "Omission of security relevant information (username not logged)."
    severity: ERROR
    metadata:
      cwe: "CWE-223"
    languages: [c, cpp]
    patterns:
      # BAD: logging an attempted login without including the username
      - pattern: |
          fprintf(stderr, "Attempted login\n");
      # GOOD: at least one logging statement in the function logs the username
      - pattern-not: |
          fprintf(stderr, "Attempted login by %s\n", username);