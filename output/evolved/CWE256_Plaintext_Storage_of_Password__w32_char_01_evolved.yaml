rules:
  - id: CWE256_Plaintext_Storage_of_Password__w32_char_01
    message: "Potential plaintext storage of password (CWE-256). The password should be decrypted/processed before passing it to LogonUserA."
    severity: ERROR
    metadata:
      cwe: "CWE-256"
    languages: [c, cpp]
    patterns:
      # Core sink pattern: LogonUserA is called with some password argument $PWD
      - pattern: |
          if (LogonUserA($USERNAME, $DOMAIN, $PWD, LOGON32_LOGON_NETWORK, LOGON32_PROVIDER_DEFAULT, &$PHANDLE) != 0) {
            ...
          } else {
            ...
          }

      # Exclude cases where the password has clearly been processed via a crypto
      # do { ... CryptDecrypt(...); ... } while (0) construct, as in the SAFE code.
      - pattern-not: |
          do {
            ...
            if(!CryptDecrypt($KEY, 0, 1, 0, $DECRYPTED_PAYLOAD, &$DECRYPTED_PAYLOAD_BYTES)) {
              break;
            }
            ...
          } while (0);

      # Exclude the variant where the decryption is done in a do { ... } while (0)
      # and THEN LogonUserA is called afterward in the same block (goodB2G).
      - pattern-not: |
          {
            ...
            do {
              ...
              if(!CryptDecrypt($KEY, 0, 1, 0, $DECRYPTED_PAYLOAD, &$DECRYPTED_PAYLOAD_BYTES)) {
                break;
              }
              ...
            } while (0);
            ...
            if (LogonUserA($USERNAME, $DOMAIN, $PWD, LOGON32_LOGON_NETWORK, LOGON32_PROVIDER_DEFAULT, &$PHANDLE) != 0) {
              ...
            } else {
              ...
            }
            ...
          }