rules:
  - id: CWE126_Buffer_Overread__CWE129_connect_socket_02
    message: "Potential buffer overread due to missing upper bound check on array index."
    severity: ERROR
    metadata:
      cwe: "CWE126"
    languages: [c, cpp]
    patterns:
      # Core bad pattern: array access guarded only by a lower-bound check (>= 0)
      - pattern: |
          if ($INDEX >= 0) {
            $SINK(...[$INDEX]...);
          }
      # Exclude cases where there is also an explicit upper-bound check on the same index
      - pattern-not: |
          if ($INDEX >= 0 && $INDEX < $UB) {
            $SINK(...[$INDEX]...);
          }
      - pattern-not: |
          if ($INDEX >= 0 && $INDEX <= $UB) {
            $SINK(...[$INDEX]...);
          }
      - pattern-not: |
          if ($INDEX > 0 && $INDEX < $UB) {
            $SINK(...[$INDEX]...);
          }
      - pattern-not: |
          if ($INDEX > 0 && $INDEX <= $UB) {
            $SINK(...[$INDEX]...);
          }