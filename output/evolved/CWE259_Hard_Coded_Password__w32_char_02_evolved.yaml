rules:
  - id: CWE259_Hard_Coded_Password__w32_char_02
    message: "Use of hardcoded password detected (CWE-259)."
    severity: ERROR
    metadata:
      cwe: "CWE-259"
    languages: [c, cpp]
    patterns:
      # Core bad pattern: copying a compile-time constant (macro/string) into a password buffer
      - pattern-either:
          - pattern: |
              strcpy($PWD_BUF, $CONST)
          - pattern: |
              strncpy($PWD_BUF, $CONST, $N)
      # Exclude the safe case where the password buffer is populated only via fgets from stdin
      - pattern-not: |
          if (fgets($PWD_BUF, $N, stdin) == NULL) {
            ...
          }