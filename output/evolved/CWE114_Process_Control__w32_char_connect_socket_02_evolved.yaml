rules:
  - id: CWE114_Process_Control__w32_char_connect_socket_02
    message: "Dynamic link library loaded without specifying a hard-coded full path, which may lead to CWE-114 (Process Control) vulnerability."
    severity: ERROR
    metadata:
      cwe: "CWE-114"
    languages: [c, cpp]
    patterns:
      # Core sink: dynamic library load with a variable (not a literal)
      - pattern-either:
          - pattern: |
              $HMODULE $hModule;
              ...
              $hModule = LoadLibraryA($DATA);
              ...
          - pattern: |
              $HMODULE $hModule;
              ...
              $hModule = LoadLibraryW($DATA);
              ...
      # Exclude obvious safe cases where the variable is directly set
      # to a hard-coded full path before loading.
      #
      # 1) Direct strcpy into the same variable used in LoadLibrary
      - pattern-not: |
          {
            ...
            $DATA = $BUF;
            ...
            strcpy($BUF, "C:\\Windows\\System32\\$LIB.dll");
            ...
            $HMODULE $hModule;
            ...
            $hModule = LoadLibraryA($DATA);
            ...
          }
      - pattern-not: |
          {
            ...
            $DATA = $BUF;
            ...
            strcpy($BUF, "C:\\Windows\\System32\\$LIB.dll");
            ...
            $HMODULE $hModule;
            ...
            $hModule = LoadLibraryW($DATA);
            ...
          }
      # 2) Direct strcpy into the same variable (no intermediate buffer)
      - pattern-not: |
          {
            ...
            strcpy($DATA, "C:\\Windows\\System32\\$LIB.dll");
            ...
            $HMODULE $hModule;
            ...
            $hModule = LoadLibraryA($DATA);
            ...
          }
      - pattern-not: |
          {
            ...
            strcpy($DATA, "C:\\Windows\\System32\\$LIB.dll");
            ...
            $HMODULE $hModule;
            ...
            $hModule = LoadLibraryW($DATA);
            ...
          }